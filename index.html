<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Scrapper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Swing your claw, grab space scrap, beat the quota. Upgrade your rusty ship across five wild zones.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{--bg:#0c0a1d;--panel:#1d2b53;--panel2:#26346a;--ink:#fff1e8;--muted:#b8b3d6;--accent:#ffec27;--pink:#ff4f9a;--good:#00e436;--bad:#ff004d;--cyan:#5ef0ff;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2b2170,#0c0a1d 70%)}
#game{display:block;touch-action:none}
[hidden]{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:linear-gradient(#0c0a1dee,#0c0a1d00);pointer-events:none}
#hud>*{pointer-events:auto}
.h-lv{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.h-time{min-width:44px;text-align:center;font-weight:800;font-size:20px;padding:2px 8px;border-radius:8px;background:var(--panel)}
.h-time.low{background:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.h-quota{flex:1;min-width:0}
.h-quota b{display:block;font-size:13px;text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#ffffff22;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.bar i.done{background:var(--good)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
#torpBtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:5;width:76px;height:76px;border-radius:50%;border:3px solid #fff3;background:var(--bad);color:#fff;font:700 11px var(--font);text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px #0008}
#torpBtn b{display:block;font-size:22px}
#torpBtn:disabled{opacity:.35}
/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:24px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left));background:#0c0a1dd9;text-align:center;overflow:auto}
/* centred when it fits, scrolls from the top when it does not */
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
#menu{background:radial-gradient(ellipse at 50% 30%,#3a1f6e,#0c0a1d 75%)}
h1{margin:0;font-size:44px;line-height:.95;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
h1 span{display:block;color:var(--pink)}
h2{margin:0;font-size:30px;color:var(--accent)}
.logo canvas{width:300px;height:150px;display:block;margin:0 auto}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font:700 16px var(--font);color:var(--ink);background:var(--panel2);cursor:pointer;min-height:46px}
.btn.primary{background:var(--pink);color:#fff}
.btn.big{font-size:20px;padding:16px 20px}
.btn.reward{background:linear-gradient(90deg,#ffb000,#ffec27);color:#1d1838}
.btn.ghost{background:transparent;border:2px solid #ffffff33}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn:not(:disabled):active{transform:scale(.97)}
.row.small .btn{font-size:14px;min-height:40px;padding:8px 14px}
.muted{color:var(--muted);margin:0;font-size:15px}
.stats{color:var(--muted);margin:0;font-size:14px;max-width:360px}
.parts{margin:0;font-weight:700;color:var(--cyan)}
.big-num{margin:0;font-size:46px;font-weight:800;color:var(--good)}
.list{display:flex;flex-direction:column;gap:8px;width:min(440px,100%)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel);text-align:left}
.item b{display:block;font-size:16px}.item small{color:var(--muted);font-weight:400}
.item span{display:block;color:var(--muted);font-size:13px}
.item em{font-style:normal;font-weight:700;color:var(--good)}
.pips{font-style:normal;color:var(--accent);font-size:12px;letter-spacing:2px}
.kv{list-style:none;margin:0;padding:0;width:min(360px,100%)}
.kv li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ffffff1f;font-size:16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:20;background:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 18px #0008;max-width:90vw}
@media (min-width:700px) and (max-height:620px){.list{display:grid;grid-template-columns:1fr 1fr;width:min(820px,100%)}.screen{gap:10px;padding-top:14px;padding-bottom:14px}h2{font-size:26px}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" aria-label="Space Scrapper"></canvas></div>
<div id="hud" hidden>
  <div class="h-lv" id="hLevel"></div>
  <div class="h-time" id="hTime"></div>
  <div class="h-quota"><b id="hCash"></b><div class="bar"><i id="hBar"></i></div></div>
  <button class="icon-btn" data-act="pause" aria-label="Pause">❚❚</button>
  <button id="torpBtn" aria-label="Torpedo"><b>1</b>Torp</button>
</div>
<section class="screen" id="menu"><p class="muted">Loading…</p></section>
<section class="screen" id="garage" hidden></section>
<section class="screen" id="clear" hidden></section>
<section class="screen" id="shop" hidden></section>
<section class="screen" id="over" hidden></section>
<section class="screen" id="pause" hidden></section>
<div id="toast" hidden></div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/sdk.js"></script>
<script src="js/game.js"></script>
<script>SS.boot();</script>
</body>
</html>
