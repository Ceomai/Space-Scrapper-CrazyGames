<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Space Scrapper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Aim your claw, fill salvage orders for picky clients and keep your rusty ship in one piece across five wild zones.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{--bg:#0c0a1d;--panel:#1d2b53;--panel2:#26346a;--ink:#fff1e8;--muted:#b8b3d6;--accent:#ffec27;--pink:#ff4f9a;--good:#00e436;--bad:#ff004d;--cyan:#5ef0ff;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2b2170,#0c0a1d 70%)}
#game{display:block;touch-action:none}
[hidden]{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:linear-gradient(#0c0a1df0,#0c0a1d00);pointer-events:none}
#hud>*{pointer-events:auto}
.h-lv{font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.h-time{min-width:52px;text-align:center;font-weight:800;font-size:24px;padding:2px 10px;border-radius:10px;background:var(--panel)}
.h-time.low{background:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.h-cash{font-weight:800;font-size:20px;color:var(--accent);white-space:nowrap}
.h-hearts{font-size:20px;color:var(--pink);letter-spacing:2px;white-space:nowrap}.h-hearts i,.hearts i{font-style:normal;opacity:.25}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
.hud-orders{position:fixed;left:max(12px,env(safe-area-inset-left));top:66px;z-index:5;display:flex;flex-direction:column;gap:6px;width:min(250px,44vw);pointer-events:none}
#hud[hidden]~.hud-orders,#hud[hidden]~.drop-btn,#hud[hidden]~.skip-tut{display:none}
.o-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.order{display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;border-radius:12px;background:#1d2b53e6;border:2px solid #ffffff14}
.order img{width:32px;height:32px;flex:none}.order span{display:block;font-weight:700;font-size:14px;line-height:1.15}.order small{display:block;color:var(--muted);font-size:12px}
.order.done{border-color:var(--good);background:#0f3d2ae6}.order.done small{color:var(--good)}
.hud-orders.pulse .order{animation:glow .7s infinite alternate}@keyframes glow{to{border-color:var(--accent);transform:scale(1.03)}}
.drop-btn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:5;width:84px;height:84px;border-radius:50%;border:3px solid #fff4;background:var(--pink);color:#fff;font:800 15px var(--font);text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px #0008}
.drop-btn:disabled{opacity:.3}
.skip-tut{position:fixed;right:max(12px,env(safe-area-inset-right));top:66px;z-index:6}
@media (max-aspect-ratio:78/100){.hud-orders{top:auto;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100vw - 130px)}.order{padding:4px 8px 4px 4px}.order img{width:26px;height:26px}.o-title{display:none}.h-lv{font-size:13px}.h-cash{font-size:16px}.h-hearts{font-size:16px}.h-time{font-size:20px;min-width:44px}.skip-tut{top:60px}}
/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:24px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left));background:#0c0a1dd9;text-align:center;overflow:auto}
/* centred when it fits, scrolls from the top when it does not */
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
#menu{background:linear-gradient(#0c0a1d99,#0c0a1dcc)}
.tagline{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:420px}
h1{margin:0;font-size:clamp(46px,9vw,84px);text-shadow:0 6px 0 #0006;line-height:.95;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
h1 span{display:block;color:var(--pink)}
h2{margin:0;font-size:34px;color:var(--accent)}
.stars{font-size:46px;color:var(--accent);letter-spacing:6px}.stars i{font-style:normal;opacity:.2}
.hearts{margin:0;font-size:26px;color:var(--pink);letter-spacing:3px}
.olist{list-style:none;margin:0;padding:0;width:min(420px,100%)}.olist li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid #ffffff1f;font-size:16px;color:var(--muted)}.olist li.ok{color:var(--ink)}.olist li.ok b{color:var(--good)}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:min(820px,100%)}
.card{flex:1 1 200px;max-width:250px;min-height:190px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 14px;border-radius:16px;border:2px solid #ffffff22;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--accent)}.card .ic{font-size:40px;color:var(--cyan);line-height:1}.card b{font-size:18px}.card small{color:var(--muted);font-size:14px}
.logo canvas{width:300px;height:150px;display:block;margin:0 auto}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:12px;padding:13px 20px;font:700 17px var(--font);color:var(--ink);background:var(--panel2);cursor:pointer;min-height:46px}
.btn.primary{background:var(--pink);color:#fff}
.btn.big{font-size:22px;padding:17px 22px}
.btn.reward{background:linear-gradient(90deg,#ffb000,#ffec27);color:#1d1838}
.btn.ghost{background:transparent;border:2px solid #ffffff33}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn:not(:disabled):active{transform:scale(.97)}
.row.small .btn{font-size:14px;min-height:40px;padding:8px 14px}
.muted{color:var(--muted);margin:0;font-size:15px}
.stats{color:var(--muted);margin:0;font-size:14px;max-width:360px}
.parts{margin:0;font-weight:700;color:var(--cyan)}
.big-num{margin:0;font-size:46px;font-weight:800;color:var(--good)}
.list{display:flex;flex-direction:column;gap:8px;width:min(440px,100%)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel);text-align:left}
.item b{display:block;font-size:16px}.item small{color:var(--muted);font-weight:400}
.item span{display:block;color:var(--muted);font-size:13px}
.item em{font-style:normal;font-weight:700;color:var(--good)}
.pips{font-style:normal;color:var(--accent);font-size:12px;letter-spacing:2px}
.kv{list-style:none;margin:0;padding:0;width:min(360px,100%)}
.kv li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ffffff1f;font-size:16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:20;background:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 18px #0008;max-width:90vw}
@media (min-width:700px) and (max-height:620px){.list{display:grid;grid-template-columns:1fr 1fr;width:min(820px,100%)}.screen{gap:10px;padding-top:14px;padding-bottom:14px}h2{font-size:26px}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" aria-label="Space Scrapper"></canvas></div>
<div id="hud" hidden>
  <div class="h-lv" id="hLevel"></div>
  <div class="h-time" id="hTime"></div>
  <div class="h-cash" id="hCash"></div>
  <div class="h-hearts" id="hHearts" aria-label="Hull"></div>
  <button class="icon-btn" data-act="pause" aria-label="Pause (P)">❚❚</button>
</div>
<div id="orders" class="hud-orders"></div>
<button id="dropBtn" class="drop-btn" aria-label="Drop (right-click or ↑)" disabled>Drop</button>
<button id="skipTut" class="btn ghost sm skip-tut" data-act="skipTut" hidden>Skip tutorial</button>
<section class="screen" id="menu"><p class="muted">Loading…</p></section>
<section class="screen" id="garage" hidden></section>
<section class="screen" id="result" hidden></section>
<section class="screen" id="pick" hidden></section>
<section class="screen" id="pause" hidden></section>
<div id="toast" hidden></div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/sdk.js"></script>
<script src="js/game.js"></script>
<script>SS.boot();</script>
</body>
</html>
